  procode_lede: >-
    The 5 patterns above map 1-to-1 to SDK builders. Same topology,
    consistent code — local, container or hosted in Foundry.
  lowcode_eyebrow: "Low-code · Foundry Workflows (YAML)"
  lowcode_title: "Same pattern, declarative and versionable"
  lowcode_lede: >-
    Foundry Workflows expresses the topology in YAML — versionable in the Foundry Project,
    with branching, fan-out, retry and timeout out of the box.
