texts:
  intro_title: "Microsoft Agent Framework (MAF) + Foundry Workflows"
  intro_lede: >-
    The <strong>Microsoft Agent Framework</strong> is the pro-code SDK that standardizes
    orchestration builders — <em>sequential, concurrent, handoff, group chat and
    magentic</em> — and runs locally or in any host. <strong>Foundry Workflows</strong>
    express the same topology declaratively (YAML), versionable in Foundry Projects.
    Both cover <strong>req 1.4.5</strong> (multi-agent orchestration) of the Contoso AI Framework.
  demo_eyebrow: Interactive demo
  demo_title: "Pick a pattern and see the topology in real time"
  demo_lede: >-
    Select one of MAF's 5 patterns — the diagram on the left re-renders and the SSE trace
    below shows the actual hop order. Same question, different behaviors.
