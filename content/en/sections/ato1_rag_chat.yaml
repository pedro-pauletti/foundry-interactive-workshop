  eval_eyebrow: Automatic evaluation
  eval_title: Run evaluation with RAG metrics
  eval_lede: >-
    Runs a <strong>canonical question set</strong> against the selected strategy
    and computes the official metrics from
    <a href="https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/rag-evaluators"
       target="_blank" rel="noopener">Foundry RAG evaluators</a>:
    <code>groundedness</code>, <code>relevance</code>, <code>retrieval</code> and
    <code>response_completeness</code>. Pass threshold: <strong>0.60</strong>.
  eval_run_button: Run RAG evaluation (current mode)
  eval_run_loading: evaluating…
