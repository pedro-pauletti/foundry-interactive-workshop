texts:
  intro_title: Enterprise RAG with Foundry IQ
  intro_lede: >-
    <strong>Foundry IQ</strong> is Foundry's managed retrieval engine: indexing,
    embeddings, hybrid search and re-ranking as a service. The demo below shows the
    <strong>impact of the retrieval strategy</strong> over the same Contoso knowledge base.
  demo_eyebrow: Interactive demo
  demo_title: Contoso Curator — switch between retrieval strategies
  demo_lede: >-
    Pick a strategy, ask a question and see
    <strong>how many documents were retrieved, with what score and what latency</strong>.
    Response comes from Foundry when configured; otherwise, from a local simulation.
  modes_aria: Retrieval strategy
  mode_simple_name: Simple Search
  mode_simple_desc: "pure keyword (BM25) · top-2 · ~150ms"
  mode_semantic_name: Semantic + Rerank
  mode_semantic_desc: "vector + reranker · top-3 · ~350ms"
  mode_agentic_name: Agentic Retrieval
  mode_agentic_desc: "query planning + fusion · top-3 · ~650ms"
  dataset_aria: Knowledge base
  dataset_label: "Base:"
  dataset_auto: Auto (both)
  dataset_auto_title: Queries both bases and merges the best results
  dataset_products_title: Products index
  dataset_regulations_title: Internal regulations index
  try_label: "Try:"
  send_button: Send
  new_chat_title: New conversation
  status_ready: Ready.
  status_reset: Conversation reset.
