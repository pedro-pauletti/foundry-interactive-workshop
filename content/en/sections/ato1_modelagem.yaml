texts:
  starting_eyebrow: Starting point · size choice
  starting_title: "Before techniques: SLM or LLM?"
  starting_p1: >-
    <strong>SLMs (Small Language Models)</strong> — models &lt; 10B parameters such as
    <em>Phi-4</em>, <em>Mistral-Small</em> and <em>Llama-3.2-3B</em> — are not a
    modeling technique; they're an <strong>architectural decision</strong>. Low latency,
    low cost, can even run at the edge. They shine in well-defined tasks (intent
    classification, entity extraction, routing). In Foundry, SLMs appear as dedicated
    deployments or via <em>Models-as-a-Service</em>.
  starting_p2: >-
    <strong>Contoso case:</strong> intent classifier on the IVR before routing to the
    agent (Phi-4 at ~3ms/req vs GPT-4o at ~280ms/req). Once the base is decided
    (SLM or LLM), the <strong>4 specialization techniques</strong> below come in.
  techniques_title: The 4 specialization techniques available in Foundry
  techniques_lede: >-
    Specializing = taking a base model (SLM or LLM) and <strong>shaping it</strong> for
    your domain. The 4 techniques below cover the spectrum: <em>distillation</em> (cheaper),
    <em>SFT</em> (format/vocabulary), <em>RLHF</em> (subjective alignment) and
    <em>DPO</em> (simplified alignment). All hosted in Foundry Models with
    governance and lineage.
  when_use_label: "When to use:"
