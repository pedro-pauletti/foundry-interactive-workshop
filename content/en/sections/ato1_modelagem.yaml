  pipeline_step_1: "<strong>1 · Collect dataset</strong> of real anonymized conversations (Foundry Traces → versioned dataset)"
  pipeline_step_2: "<strong>2 · Curate pairs</strong> (input, ideal response) — human supervision via Foundry Annotations"
