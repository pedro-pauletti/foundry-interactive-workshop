texts:
  intro_title: Why classify risk before deploy?
  intro_lede: >-
    Risk classification turns a subjective requirement ("is it safe?") into
    <strong>measurable criteria</strong> that become <em>policy-as-code</em>.
    Without it, <strong>PL 2338/2023</strong> (Brazil's AI Legal Framework, in progress) and
    <strong>LGPD art. 20</strong> (review of automated decisions) become slow manual
    processes. With Custom Azure Policy in Foundry Control Plane, it becomes an
    <em>automated guardrail</em>.
