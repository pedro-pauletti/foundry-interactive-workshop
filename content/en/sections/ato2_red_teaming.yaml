texts:
  intro_title: "PyRIT + Foundry — automated red teaming"
  intro_lede: >-
    Foundry's <strong>AI Red Teaming Agent</strong> uses Microsoft's open-source
    <strong>PyRIT</strong> to generate and execute attacks against agents/models.
    Each risk category is attacked with different <strong>strategies</strong> (Flip, Base64, ROT13, …)
    at <code>easy</code>, <code>moderate</code> and <code>difficult</code> complexity levels.
    The result is an auditable scorecard, exactly like the example from the
    <a href="https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/red-team-evaluator"
       target="_blank" rel="noopener">Foundry red-team evaluator</a>.
  fig_alt: How AI Red Teaming works
  fig_cap: "AI Red Teaming Agent flow: generates attacks via PyRIT, runs them against the target agent and produces an auditable scorecard."
  howto_title: How to create a red team run
  demo_eyebrow: Interactive demo
  demo_title: Adversarial evaluation dashboard
  demo_lede: >-
    Runs a full scan (categories × strategies × 2 prompts) and renders
    the same panel the red teaming notebook delivers to the security team.
