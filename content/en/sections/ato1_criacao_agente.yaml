section:
  title: Criação Simplificada de Agente
  description: 'Do Foundry Playground ao VS Code: criar o Curador Contoso em minutos com fluxos low-code e declarativos.'
  eyebrow: Construir
  eyebrow_icon: fa-solid fa-screwdriver-wrench
body:
  pillars:
  - Engenharia de Prompt
  - Modelagem
  requisitos:
  - id: 1.1.1
    titulo: Equipes não-especialistas em IA criam agentes
  - id: 1.1.6
    titulo: Acelerar e popularizar a criação
  blocks:
  - titulo: Concept — three surfaces, one artifact
    html: <p>Contoso's first concern is that <strong>only engineers can create agents today</strong>. The Microsoft stack
      eliminates that by offering <strong>three complementary surfaces</strong> that all produce the same artifact (<code>agent.yaml</code>):</p><ul><li><strong>Foundry
      Playground</strong> — guided UI for PMs and business analysts.</li><li><strong>AI Toolkit / Foundry VS Code extension</strong>
      — low-code flow inside the IDE with auto-complete, debug and push to Foundry.</li><li><strong>Declarative agent workflows</strong>
      — multi-agent as versionable YAML, with auditable nodes/branches/loops.</li></ul><p>Even if an agent is born in the
      Playground, it migrates to code with no rework — the resulting YAML is identical to what goes into Git.</p><figure class="section-figure"><img
      src="/static/images/agent-playground-evaluation-metrics.png" alt="Foundry Playground showing real-time evaluation metrics
      while iterating on the agent"><figcaption>Foundry Playground showing real-time evaluation metrics while iterating on
      the agent &mdash; the same UI used to build the agent from scratch.</figcaption></figure>
  - titulo: Foundry VS Code extension (low-code workflows)
    html: "<figure class=\"section-figure\" style=\"margin: 0 0 18px;\"><img src=\"/static/images/vscode-extension-foundry.png\"\
      \ alt=\"Microsoft Foundry VS Code extension showing the model catalog, agents and tools inside the IDE\"><figcaption>VS\
      \ Code + Foundry extension &mdash; model catalog, agent designer, local playground and push-to-Foundry, all inside the\
      \ IDE.</figcaption></figure><p>The <strong>Foundry VS Code extension</strong> (Microsoft AI Toolkit) brings the full\
      \ Foundry experience into the IDE — no context switching:</p><ul><li><strong>Model catalog</strong> filtered by price,\
      \ latency and modality — 1-click deploy.</li><li>Low-code <strong>agent designer</strong>: drag tools, knowledge sources\
      \ and define instructions with IntelliSense on the <code>agent.yaml</code>.</li><li><strong>Local playground</strong>\
      \ connected to the remote agent — test the conversation without deploying.</li><li>Built-in <strong>trace viewer</strong>:\
      \ each turn shows tool calls, tokens, latency.</li><li><strong>Push to Foundry</strong>: commit + push publishes a new\
      \ version into the selected Foundry project.</li></ul><div class=\"code-caption\">contoso-knowledge-curator/agent.yaml\
      \ — generated by VS Code</div><pre class=\"code-block\"><code class=\"language-yaml\"># contoso-knowledge-curator/agent.yaml\n\
      name: contoso-knowledge-curator\nversion: 3\nmodel:\n  id: gpt-4o\n  parameters:\n    temperature: 0.2\ninstructions:\
      \ |\n  Você é o curador de conhecimento Contoso. Responda APENAS com base\n  no contexto fornecido. Se não houver evidência,\
      \ diga\n  &quot;não encontrei na base&quot; — nunca invente.\ntools:\n  - type: foundry_iq\n    knowledge_source: contoso-docs-index\n\
      \  - type: openapi\n    name: customer_billing\n    spec: ./tools/billing.openapi.yaml\n</code></pre><p>This file is\
      \ the <strong>single source of truth</strong> for the agent — Playground, VS Code and production all consume the same\
      \ YAML.</p>"
  - titulo: Declarative agent workflows (multi-agent as YAML)
    html: "<p>For cases where <strong>one agent isn't enough</strong> (e.g. classify intent → route to a specialist → consolidate\
      \ response), Foundry offers <strong>declarative agent workflows</strong>: multi-agent expressed as a YAML graph.</p><div\
      \ class=\"code-caption\">atendimento-contoso/workflow.yaml</div><pre class=\"code-block\"><code class=\"language-yaml\"\
      ># atendimento-contoso/workflow.yaml — Declarative agent workflow\nname: atendimento-contoso\ntrigger:\n  type: chat\n\
      nodes:\n  - id: classify\n    type: agent\n    ref: classifier-agent           # decide: billing | support | sales\n\
      \  - id: route\n    type: switch\n    on: ${{ classify.output.intent }}\n    cases:\n      billing: { next: billing_agent\
      \ }\n      support: { next: support_agent }\n      sales:   { next: sales_agent }\n  - id: billing_agent\n    type:\
      \ agent\n    ref: contoso-billing-agent\n  - id: support_agent\n    type: agent\n    ref: contoso-support-agent\n  -\
      \ id: sales_agent\n    type: agent\n    ref: contoso-sales-agent\n</code></pre><ul><li><strong>Nodes</strong> are agents,\
      \ switches, loops, http calls — composition without imperative code.</li><li><strong>Versioned in Git</strong> and reviewable\
      \ by PR like any other artifact.</li><li><strong>Native observability</strong>: each workflow execution produces an\
      \ OpenTelemetry trace with each hop.</li><li>Ideal for the <em>A2A multi-agent</em> scenario shown later in the workshop.</li></ul>"
  tutorial_titulo: Live demo in Foundry + VS Code
  tutorial_passos:
  - titulo: Create in the Foundry Playground
    html: Open <em>Foundry → Playground → New Agent</em>. Select model (<code>gpt-4o</code>), name <strong>contoso-knowledge-curator</strong>,
      instruction in English.
  - titulo: Attach a Knowledge Source (Foundry IQ)
    html: Add a <em>Knowledge Source</em> pointing to Contoso internal documentation. This index will be reused in the RAG
      section.
  - titulo: Open the same agent in VS Code
    html: 'Via the Foundry / AI Toolkit extension: <em>Foundry → My Agents → Open in VS Code</em>. Edit the <code>agent.yaml</code>,
      run it in the local playground (F5) and push back.'
  - titulo: Compose a declarative workflow
    html: Create <code>workflow.yaml</code> routing to 3 specialist agents (billing/support/sales) — direct bridge to the
      A2A multi-agent demo.
  mensagem_chave: <strong>Time-to-first-agent goes from weeks to minutes</strong>, without compromising the professional cycle
    — Playground, VS Code extension and declarative workflows produce the same governable artifact.
  body_localized: true
