texts:
  intro_title: "A2A — Agent-to-Agent + APIM AI Gateway"
  intro_lede: >-
    The <strong>A2A protocol</strong> (Agent-to-Agent, open standard) lets local agents
    talk to agents hosted on Foundry — or from any other provider.
    The <strong>APIM AI Gateway</strong> sits in front with a layer of
    <em>quotas, semantic caching, token budgeting and audit logs</em>.
  fig1_alt: "APIM AI Gateway architecture"
  fig1_caption: "APIM AI Gateway centralizing quotas, semantic cache and auditing between clients and model/agent back-ends."
  fig2_alt: "A2A architecture between agents"
  fig2_caption: "A2A topology: local and hosted agents talk via an open protocol, orthogonal to the framework."
  demo_eyebrow: "Interactive demo"
  demo_title: "Orchestrate agents via A2A — real-time execution"
  demo_lede: >-
    Send a question. The <strong>diagram on the left</strong> highlights, in real time,
    the path taken by the orchestrator — each node pulses when invoked. On the
    <strong>right</strong>, the chat shows each agent's input/output as
    <em>SSE streaming</em> events arrive from the server.
  diagram_aria: "A2A diagram"
