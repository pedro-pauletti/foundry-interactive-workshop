texts:
  intro_title: "PyRIT + Foundry — red teaming automatizado"
  intro_lede: >-
    O <strong>AI Red Teaming Agent</strong> do Foundry usa o open-source
    <strong>PyRIT</strong> da Microsoft para gerar e executar ataques contra agentes/modelos.
    Cada categoria de risco é atacada com diferentes <strong>estratégias</strong> (Flip, Base64, ROT13, …)
    em níveis de complexidade <code>easy</code>, <code>moderate</code> e <code>difficult</code>.
    O resultado é um scorecard auditável, exatamente como o exemplo do
    <a href="https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/red-team-evaluator"
       target="_blank" rel="noopener">red-team evaluator do Foundry</a>.
  fig_alt: Como o AI Red Teaming funciona
  fig_cap: "Fluxo do AI Red Teaming Agent: gera ataques via PyRIT, executa contra o agente alvo e produz scorecard auditável."
  howto_title: Como criar uma red team run
  demo_eyebrow: Demo Interativa
  demo_title: Dashboard de avaliação adversarial
  demo_lede: >-
    Roda um scan completo (categorias × estratégias × 2 prompts) e renderiza
    o mesmo painel que o notebook de red teaming entrega ao time de segurança.
