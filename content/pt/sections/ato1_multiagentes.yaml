texts:
  intro_title: "Microsoft Agent Framework (MAF) + Foundry Workflows"
  intro_lede: >-
    O <strong>Microsoft Agent Framework</strong> é o SDK pro-code que padroniza os
    builders de orquestração — <em>sequential, concurrent, handoff, group chat e
    magentic</em> — e roda local ou em qualquer host. Os <strong>Foundry Workflows</strong>
    expressam a mesma topologia de forma declarativa (YAML), versionável no Foundry Projects.
    Ambos cobrem o <strong>req 1.4.5</strong> (orquestração multi-agente) do Framework IA Contoso.
  demo_eyebrow: Demo Interativa
  demo_title: "Escolha o padrão e veja a topologia em tempo real"
  demo_lede: >-
    Selecione um dos 5 padrões do MAF — o diagrama à esquerda re-renderiza e o trace SSE
    abaixo mostra a ordem real dos hops. Mesma pergunta, comportamentos distintos.
  source_mock_title: "Simulação local"
  source_real_title: "Resposta do MAFW real"
