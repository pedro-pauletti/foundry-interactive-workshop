  procode_eyebrow: "Pro-code · MAF (Python)"
  procode_title: "Builders do Microsoft Agent Framework"
  procode_lede: >-
    Os 5 padrões expostos acima mapeiam 1-para-1 nos builders do SDK. Mesma topologia,
    código consistente — local, container ou hosted no Foundry.
  lowcode_eyebrow: "Low-code · Foundry Workflows (YAML)"
  lowcode_title: "Mesmo padrão, declarativo e versionável"
  lowcode_lede: >-
    O Foundry Workflows expressa a topologia em YAML — versionável no Foundry Project,
    com branching, fan-out, retry e timeout de fábrica.
