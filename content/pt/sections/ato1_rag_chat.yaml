texts:
  intro_title: RAG corporativo com Foundry IQ
  intro_lede: >-
    O <strong>Foundry IQ</strong> é o motor de retrieval gerenciado do Foundry: indexação,
    embeddings, hybrid search e re-ranking como serviço. A demo abaixo mostra o
    <strong>impacto da estratégia de retrieval</strong> sobre a mesma base de conhecimento Contoso.
  demo_eyebrow: Demo Interativa
  demo_title: Curador Contoso — alterne entre estratégias de retrieval
  demo_lede: >-
    Selecione uma estratégia, faça uma pergunta e veja
    <strong>quantos documentos foram recuperados, com que score e qual a latência</strong>.
    A resposta vem do Foundry quando configurado; caso contrário, de uma simulação local.
  modes_aria: Estratégia de retrieval
  mode_simple_name: Simple Search
  mode_simple_desc: "keyword (BM25) puro · top-2 · ~150ms"
  mode_semantic_name: Semantic + Rerank
  mode_semantic_desc: "vetor + reranker · top-3 · ~350ms"
  mode_agentic_name: Agentic Retrieval
  mode_agentic_desc: "query planning + fusion · top-3 · ~650ms"
