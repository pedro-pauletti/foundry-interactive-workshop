  eval_title: Rodar evaluation com métricas de RAG
  eval_lede: >-
    Executa um <strong>conjunto canônico de perguntas</strong> contra a estratégia selecionada
    e calcula as métricas oficiais do
    <a href="https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/rag-evaluators"
       target="_blank" rel="noopener">Foundry RAG evaluators</a>:
    <code>groundedness</code>, <code>relevance</code>, <code>retrieval</code> e
    <code>response_completeness</code>. Threshold de pass: <strong>0.60</strong>.
