texts:
  intro_title: "A2A — Agent-to-Agent + APIM AI Gateway"
  intro_lede: >-
    O <strong>A2A protocol</strong> (Agent-to-Agent, padrão aberto) permite que agentes
    locais conversem com agentes hospedados no Foundry — ou de qualquer outro provedor.
    O <strong>APIM AI Gateway</strong> coloca à frente uma camada de
    <em>quotas, semantic caching, token budgeting e logs de auditoria</em>.
  fig1_alt: "Arquitetura do APIM AI Gateway"
  fig1_caption: "APIM AI Gateway centralizando quotas, cache semântico e auditoria entre clientes e back-ends de modelos/agentes."
  fig2_alt: "Arquitetura A2A entre agentes"
  fig2_caption: "Topologia A2A: agentes locais e hospedados conversam via protocolo aberto, ortogonal ao framework."
  demo_eyebrow: "Demo Interativa"
  demo_title: "Orquestrar agentes via A2A — execução em tempo real"
  demo_lede: >-
    Envie uma pergunta. O <strong>diagrama à esquerda</strong> destaca, em tempo real,
    o caminho percorrido pelo orquestrador — cada nó pulsa quando é invocado. À
    <strong>direita</strong>, o chat mostra a entrada/saída de cada agente conforme
    os eventos de <em>streaming SSE</em> chegam do servidor.
  diagram_aria: "Diagrama A2A"
