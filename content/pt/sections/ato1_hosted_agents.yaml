  demo_title: "Mesmo agente · dois runtimes — Local container × Foundry Hosted"
  demo_lede: >-
    Escolha um agente Contoso (MAF ou LangGraph) e mande a mesma pergunta nos
    dois runtimes: o <strong>container local</strong> (Docker Desktop) e o
    <strong>mesmo binário hospedado no Foundry Agent Service</strong>. Compare
    resposta, latência e a fonte — é o mesmo código, só muda quem opera.
