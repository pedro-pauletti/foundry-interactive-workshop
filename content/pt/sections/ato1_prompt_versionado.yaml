texts:
  demo_eyebrow: Live demo
  demo_title: Otimização de prompt — LLMLingua
  demo_lede: >-
    Cole um prompt verboso e teste técnicas de
    <a href="https://github.com/microsoft/LLMLingua" target="_blank" rel="noopener">
    <strong>LLMLingua</strong></a> (compressão por importância de token, com até 20× de redução
    em alguns cenários). Os tokens são estimados localmente e tudo roda offline para a demo.
    O <strong>Foundry prompt-optimizer</strong> só existe hoje no portal do Foundry &mdash;
    use-o lá para reescrita estruturada complementar.
  mock_badge_title: Heurística local que aproxima o LLMLingua
  original_prompt: Prompt original
  tokens_label: "tokens:"
  default_prompt: >-
    Por favor, você poderia me ajudar com a seguinte questão? Eu gostaria muito que você atuasse como um especialista no atendimento ao cliente da Contoso. É muito importante que você responda apenas com base no contexto fornecido abaixo, e basicamente não invente nada por favor. Observação: se você realmente não souber a resposta, gostaria que você apenas dissesse que não encontrou na base. Pergunta do cliente: como faço para fazer a portabilidade do meu número de outra operadora para a Contoso? Quais documentos eu preciso e quanto tempo demora todo o processo? Contexto: A portabilidade numérica permite que o cliente mantenha seu número ao trocar de operadora. É necessário apresentar RG e CPF. O prazo é de até 3 dias úteis.
  prompt_placeholder: Cole aqui um prompt longo, verboso ou redundante…
  question_label: "Pergunta-alvo (question-aware):"
  default_question: como faço para fazer a portabilidade?
  ratio_label: "Target ratio (LLMLingua):"
