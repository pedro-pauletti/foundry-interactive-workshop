section:
  title: Agent 365 e Purview
  description: Inventário corporativo de agentes + DLP, classificação e auditoria via Purview — e como expor o seu agente
    no Agent 365.
  eyebrow: Operar & Governar
  eyebrow_icon: fa-solid fa-tower-broadcast
body:
  pillars:
  - Governança
  - Transversal
  - Operação
  requisitos:
  - id: 1.3.6
    titulo: Trilha de auditoria por agente / versão
  - id: 1.3.7
    titulo: Inventário corporativo de agentes
  - id: 1.3.8
    titulo: DLP, classificação e proteção de dados
  blocks:
  - titulo: Qué es Agent 365 + Purview
    html: '<div class="product-logo-row" style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:0 0 16px;"><img
      class="product-logo product-logo--lg" src="/static/agent365-logo.png" alt="Microsoft Agent 365"><img class="product-logo
      product-logo--lg" src="/static/purview-logo.png" alt="Microsoft Purview"><img class="product-logo product-logo--lg"
      src="/static/entra-logo.png" alt="Microsoft Entra ID"></div><p><strong>Microsoft Agent 365</strong> es el <em>Admin
      Center</em> + runtime de superficies de los agentes corporativos: catálogo único, identidad en Entra, ciclo de vida,
      descubrimiento en Microsoft 365 Chat / Teams / Outlook y gobernanza vía Purview.</p><p><strong>Microsoft Purview</strong>
      aplica DLP, clasificación de información y auditoría — el mismo motor ya usado para Microsoft 365 y los datos corporativos
      de Contoso, ahora extendido a prompts, respuestas y tool-calls de los agentes.</p><ul><li><strong>Inventario único</strong>
      de agentes Foundry, Copilot Studio y de partners.</li><li><strong>Identidad de agente</strong> en Entra ID — cada agente
      es un <em>principal</em> auditable.</li><li><strong>Purview DLP</strong> sobre prompts, respuestas y datos retornados
      por el RAG.</li><li><strong>Clasificación automática</strong> de los datos sensibles accedidos.</li><li><strong>Auditoría
      unificada</strong> con el resto del ecosistema Microsoft 365.</li></ul>'
  - titulo: Cómo exponer un agente en Agent 365 — visión general
    html: <p>Exponer un agente en Agent 365 es un flujo de <strong>cuatro pasos</strong>:</p><ol><li><strong>Tener un runtime</strong>
      — un Hosted Agent en Foundry (recomendado) o un endpoint HTTPS propio que implemente el protocolo de llamada del Agent
      365.</li><li><strong>App registration</strong> en Entra ID que representa al agente (<em>custom client app registration</em>).</li><li><strong>Registrar
      el agente</strong> en Agent 365 vía SDK Python (o portal).</li><li><strong>Publicar a la organización</strong> y aplicar
      políticas Purview.</li></ol><p>La documentación oficial cubre cada paso:</p><ul><li><a href="https://learn.microsoft.com/en-us/microsoft-agent-365/developer/get-started"
      target="_blank" rel="noopener">Get started — Agent 365 developer</a></li><li><a href="https://learn.microsoft.com/en-us/microsoft-agent-365/developer/agent-365-sdk?tabs=python"
      target="_blank" rel="noopener">Agent 365 SDK (Python)</a></li><li><a href="https://learn.microsoft.com/en-us/microsoft-agent-365/developer/custom-client-app-registration"
      target="_blank" rel="noopener">Custom client app registration</a></li></ul>
  - titulo: Paso 1 · Tener un runtime (Hosted Agent o propio)
    html: '<p>Si seguiste la sección <em>Hosted Agents</em>, el runtime ya está listo: anota el <code>asst_...</code> del
      agente y el endpoint del proyecto Foundry. Los usarás en el paso 3.</p><p>Si prefieres un runtime propio (LangGraph
      / MAFW expuesto vía APIM), Agent 365 acepta endpoints HTTPS siempre que implementen el contrato documentado en <em>Agent
      365 SDK → Custom endpoints</em>.</p>'
  - titulo: Paso 2 · App registration en Entra ID
    html: "<p>Agent 365 exige una <strong>app registration propia</strong> (no reaprovechar la del webapp). Representa la\
      \ identidad del agente cuando:</p><ul><li>recibe tokens delegados del usuario que está conversando;</li><li>llama a\
      \ Microsoft Graph en nombre de ese usuario;</li><li>aparece en el inventario corporativo con el publisher correcto.</li></ul><p>Mínimo\
      \ necesario (resumen de <em>custom-client-app-registration</em>):</p><ul><li><code>signInAudience</code> = <strong>AzureADMyOrg</strong>\
      \ (single-tenant) o <strong>AzureADMultipleOrgs</strong> según la distribución.</li><li><strong>Redirect URI</strong>\
      \ de tipo <em>Public client/native</em> (<code>http://localhost</code>) — Agent 365 usa device code / interactive.</li><li>Activar\
      \ <strong>Allow public client flows</strong>.</li><li><strong>API permissions</strong>: <code>openid</code>, <code>profile</code>,\
      \ <code>offline_access</code> (Microsoft Graph) + scope <code>Agent.Invoke</code> del Agent 365 service.</li></ul><p>En\
      \ IaC queda así:</p><div class=\"code-caption\">infra/app-registration.bicep</div><pre class=\"code-block\"><code class=\"\
      language-bicep\">// app-registration.bicep — App registration mínima para Agent 365\n// Refs: learn.microsoft.com/.../custom-client-app-registration\n\
      resource agentApp &#x27;Microsoft.Graph/applications@v1.0&#x27; = {\n  uniqueName: &#x27;curador-contoso-agent&#x27;\n\
      \  displayName: &#x27;Curador de Conhecimento Contoso&#x27;\n  signInAudience: &#x27;AzureADMyOrg&#x27;\n  api: {\n\
      \    requestedAccessTokenVersion: 2\n  }\n  requiredResourceAccess: [\n    {\n      // Microsoft Graph\n      resourceAppId:\
      \ &#x27;00000003-0000-0000-c000-000000000000&#x27;\n      resourceAccess: [\n        // openid / profile / offline_access\
      \ — login do usuário\n        { id: &#x27;37f7f235-527c-4136-accd-4a02d197296e&#x27;, type: &#x27;Scope&#x27; }\n  \
      \      { id: &#x27;14dad69e-099b-42c9-810b-d002981feec1&#x27;, type: &#x27;Scope&#x27; }\n        { id: &#x27;7427e0e9-2fba-42fe-b0c0-848c9e6a8182&#x27;,\
      \ type: &#x27;Scope&#x27; }\n      ]\n    }\n    {\n      // Microsoft Agent 365 service\n      resourceAppId: &#x27;&lt;agent-365-service-app-id&gt;&#x27;\n\
      \      resourceAccess: [\n        { id: &#x27;&lt;scope-Agent.Invoke&gt;&#x27;, type: &#x27;Scope&#x27; }\n      ]\n\
      \    }\n  ]\n}\n</code></pre>"
  - titulo: Paso 3 · Registrar vía Agent 365 SDK (Python)
    html: "<p>Instala el SDK y registra el agente — una vez por ambiente:</p><pre class=\"code-block\"><code class=\"language-bash\"\
      >pip install microsoft-agent365</code></pre><div class=\"code-caption\">register_agent.py</div><pre class=\"code-block\"\
      ><code class=\"language-python\"># Registrar o agente no Agent 365 (one-time)\nfrom microsoft_agent365 import AgentClient\n\
      from azure.identity import DefaultAzureCredential\n\nclient = AgentClient(credential=DefaultAzureCredential())\n\nagent\
      \ = client.agents.create(\n    display_name=&quot;Curador de Conhecimento Contoso&quot;,\n    description=&quot;Responde\
      \ dúvidas internas com base na documentação corporativa.&quot;,\n    publisher=&quot;Contoso&quot;,\n    # Endpoint\
      \ de runtime — Foundry Hosted Agent OU URL HTTPS própria.\n    endpoint={\n        &quot;type&quot;: &quot;foundry_hosted&quot;,\n\
      \        &quot;foundry_agent_id&quot;: &quot;asst_xxxxxxxxxxxxxxxx&quot;,\n        &quot;project_endpoint&quot;: &quot;https://&lt;projeto&gt;.services.ai.azure.com/api/projects/&lt;projeto&gt;&quot;,\n\
      \    },\n    # App registration que representa o agente no Entra (ver passo 2).\n    client_app_id=&quot;&lt;application-id-do-app-registration&gt;&quot;,\n\
      \    # Capacidades que o agente expõe ao Microsoft 365.\n    capabilities=[&quot;chat&quot;, &quot;search&quot;, &quot;actions&quot;],\n\
      )\nprint(&quot;Agente registrado em Agent 365:&quot;, agent.id)\n</code></pre><p><code>endpoint.type=\"foundry_hosted\"\
      </code> apunta al Hosted Agent creado en el acto anterior. Para runtime propio usa <code>type=\"https\"</code> + <code>url</code>.</p>"
  - titulo: Paso 4 · Publicar y aplicar políticas Purview
    html: "<p>Una vez registrado, el agente queda <strong>invocable vía SDK</strong>:</p><div class=\"code-caption\">invoke_agent.py</div><pre\
      \ class=\"code-block\"><code class=\"language-python\"># Conversar com o agente via Agent 365 SDK\nfrom microsoft_agent365\
      \ import AgentClient\nfrom azure.identity import DefaultAzureCredential\n\nclient = AgentClient(credential=DefaultAzureCredential())\n\
      \nconv = client.conversations.create(agent_id=agent.id)\nclient.messages.send(\n    conversation_id=conv.id,\n    content=&quot;Quais\
      \ planos de fibra para home office?&quot;,\n)\n\nfor msg in client.messages.list(conversation_id=conv.id):\n    print(msg.role,\
      \ &quot;→&quot;, msg.content)\n</code></pre><p>Para que aparezca automáticamente en <strong>Microsoft 365 Chat</strong>,\
      \ <strong>Teams</strong> y <strong>Outlook</strong> de los colaboradores Contoso:</p><ul><li>En <em>Microsoft Admin\
      \ Center → Agent 365</em>, cambiar el estado del agente a <strong>Published</strong> y elegir el alcance (toda la Contoso,\
      \ BU, grupo Entra…).</li><li>Aplicar una <strong>Purview DLP policy</strong> al agente (ej.: bloquear envío de CPF en\
      \ respuestas, clasificar contenido como <em>Confidential</em>).</li><li>El <strong>Compliance Portal</strong> empieza\
      \ a registrar prompts, respuestas y tool-calls para auditoría y e-Discovery.</li></ul>"
  tutorial_titulo: Demostrar en vivo
  tutorial_passos:
  - titulo: Mostrar el inventario en Admin Center → Agent 365
    html: Catálogo de agentes Contoso, con publisher, owners, versiones y estado.
  - titulo: Onboard del Curador
    html: Ejecutar <code>register_agent.py</code> apuntando al Hosted Agent creado en la sección anterior — verlo aparecer
      en el inventario en segundos.
  - titulo: Conversar vía Microsoft 365 Chat
    html: Abrir <em>M365 Chat</em>, mencionar al Curador (<code>@Curador Contoso</code>) y lanzar una pregunta — el tracing
      aparece tanto en Foundry como en Compliance Portal.
  - titulo: Aplicar Purview DLP
    html: Crear una policy que bloquea PII en respuestas y ver al agente rechazar automáticamente — auditable en el Compliance
      Portal.
  mensagem_chave: <strong>Agent 365 = onboarding corporativo del agente</strong>. Con un Hosted Agent + una app registration
    + una llamada del SDK, el Curador Contoso aparece en Microsoft 365 Chat, Teams y Outlook de todos los colaboradores —
    y entra automáticamente en el perímetro de gobernanza Purview, evitando shadow-AI.
  extra_html: '<hr class="section-separator" aria-hidden="true"><section class="page-summary" style="margin-top: 16px;"><span
    class="page-eyebrow"><i class="fa-solid fa-image"></i> Pantallas reales &middot; Agent 365 Admin Center</span><h2 class="page-summary__title">Cómo
    aparece el Curador en el inventario corporativo</h2><p class="page-summary__lede">Después de ejecutar <code>register_agent.py</code>,
    el agente existe en <strong>Microsoft 365 Admin Center &rarr; Agent 365</strong>. Las cuatro pantallas siguientes cubren
    el ciclo: <em>registry</em> &rarr; <em>overview</em> &rarr; <em>details</em> &rarr; <em>agent map</em> (visión multi-agente).</p></section><div
    class="section-figure section-figure--row" style="margin-top: 16px;"><figure><img src="/static/images/agent-in-registry-agent-365.png"
    alt="Agente listado en el registry de Agent 365"><figcaption>1. <strong>Registry</strong> &mdash; el Curador entra en
    el inventario corporativo, con publisher, owners y estado.</figcaption></figure><figure><img src="/static/images/agent-overview-agent-365.png"
    alt="Pantalla overview del agente en Agent 365"><figcaption>2. <strong>Overview</strong> &mdash; tarjeta ejecutiva: descripción,
    owners, políticas aplicadas y métricas resumidas.</figcaption></figure><figure><img src="/static/images/agent-details-agent365.png"
    alt="Detalles técnicos del agente en Agent 365"><figcaption>3. <strong>Details</strong> &mdash; tools, knowledge sources,
    identidad en Entra, versión y telemetría por turno.</figcaption></figure><figure><img src="/static/images/agent-map-agent-365.png"
    alt="Vista Agent Map de relaciones entre agentes"><figcaption>4. <strong>Agent Map</strong> &mdash; topología de agentes
    que se llaman (A2A) y tools compartidas, base para análisis de blast-radius.</figcaption></figure></div>'
  body_localized: true
