texts:
  intro_title: "A2A — Agent-to-Agent + APIM AI Gateway"
  intro_lede: >-
    El <strong>protocolo A2A</strong> (Agent-to-Agent, estándar abierto) permite que agentes
    locales conversen con agentes hospedados en Foundry — o de cualquier otro proveedor.
    El <strong>APIM AI Gateway</strong> coloca delante una capa de
    <em>cuotas, caché semántico, token budgeting y registros de auditoría</em>.
  fig1_alt: "Arquitectura del APIM AI Gateway"
  fig1_caption: "APIM AI Gateway centralizando cuotas, caché semántico y auditoría entre clientes y back-ends de modelos/agentes."
  fig2_alt: "Arquitectura A2A entre agentes"
  fig2_caption: "Topología A2A: agentes locales y hospedados conversan vía protocolo abierto, ortogonal al framework."
  demo_eyebrow: "Demo interactiva"
  demo_title: "Orquestar agentes vía A2A — ejecución en tiempo real"
  demo_lede: >-
    Envía una pregunta. El <strong>diagrama a la izquierda</strong> destaca, en tiempo real,
    el camino recorrido por el orquestador — cada nodo pulsa al ser invocado. A la
    <strong>derecha</strong>, el chat muestra la entrada/salida de cada agente conforme
    llegan los eventos de <em>streaming SSE</em> desde el servidor.
  diagram_aria: "Diagrama A2A"
