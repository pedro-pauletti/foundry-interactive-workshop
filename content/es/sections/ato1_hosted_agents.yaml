texts:
  demo_eyebrow: Demo Interactiva
  demo_title: "Mismo agente · dos runtimes — Contenedor local × Foundry Hosted"
  demo_lede: >-
    Elija un agente Contoso (MAF o LangGraph) y envíe la misma pregunta a los
    dos runtimes: el <strong>contenedor local</strong> (Docker Desktop) y el
    <strong>mismo binario alojado en Foundry Agent Service</strong>. Compare
    respuesta, latencia y fuente — es el mismo código, solo cambia quién lo opera.
