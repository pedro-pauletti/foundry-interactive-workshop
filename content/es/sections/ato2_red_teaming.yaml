texts:
  intro_title: "PyRIT + Foundry — red teaming automatizado"
  intro_lede: >-
    El <strong>AI Red Teaming Agent</strong> de Foundry usa el open-source
    <strong>PyRIT</strong> de Microsoft para generar y ejecutar ataques contra agentes/modelos.
    Cada categoría de riesgo es atacada con diferentes <strong>estrategias</strong> (Flip, Base64, ROT13, …)
    en niveles de complejidad <code>easy</code>, <code>moderate</code> y <code>difficult</code>.
    El resultado es un scorecard auditable, exactamente como el ejemplo del
    <a href="https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/red-team-evaluator"
       target="_blank" rel="noopener">red-team evaluator de Foundry</a>.
  fig_alt: Cómo funciona el AI Red Teaming
  fig_cap: "Flujo del AI Red Teaming Agent: genera ataques vía PyRIT, los ejecuta contra el agente objetivo y produce scorecard auditable."
  howto_title: Cómo crear un red team run
  demo_eyebrow: Demo interactiva
  demo_title: Dashboard de evaluación adversarial
  demo_lede: >-
    Ejecuta un scan completo (categorías × estrategias × 2 prompts) y renderiza
    el mismo panel que el notebook de red teaming entrega al equipo de seguridad.
