  resumo: Microsoft trabaja con una <strong>plataforma unificada</strong> centrada en <strong>Microsoft Foundry</strong>,
    con capas adyacentes de gobernanza (<strong>Entra</strong>, <strong>Purview</strong>, <strong>Agent 365</strong>) y tráfico
    (<strong>APIM AI Gateway</strong>). Gobernanza y dev/operación no son partes separadas, sino el mismo ciclo que se retroalimenta
    — <em>from code to runtime</em>.
  bullets:
  - <img class="product-logo" src="/static/foundry-logo.png" alt="Microsoft Foundry"> <strong>Microsoft Foundry</strong> —
    Modelos, Agentes, Evaluators, Guardrails, Observabilidad.
  - <img class="product-logo" src="/static/agent365-logo.png" alt="Microsoft Agent 365"> <strong>Microsoft Agent 365</strong>
    — Gestión y gobernanza de agentes a escala corporativa.
  - <img class="product-logo" src="/static/apim-logo.png" alt="Azure API Management"> <strong>APIM AI Gateway</strong> — Token
    rate limiting, semantic caching, load balancing.
  - <img class="product-logo" src="/static/entra-logo.png" alt="Microsoft Entra"> <strong>Microsoft Entra</strong> — Identidad,
    RBAC, segregación de funciones, identidad de agente.
  - <img class="product-logo" src="/static/purview-logo.png" alt="Microsoft Purview"> <strong>Microsoft Purview</strong> —
    DLP, clasificación, auditoría, compliance regulatorio (LGPD, PL 2338, AI Act).
  passos_titulo: Ciclo Definición → Desarrollo → Deploy → Operación
  passos_lede: El flujo siguiente mapea <em>quién</em> hace <em>qué</em> en cada etapa, y qué producto Microsoft respalda
    la actividad.
  passos:
  - titulo: Definición (Seguridad define políticas corporativas)
    html: <strong>Quién:</strong> equipos de Seguridad y Compliance.<br><strong>Dónde:</strong> Microsoft Purview, Entra,
      Defender + Foundry Guardrails policies globales.<br><em>Define/Apply enterprise policies</em> que se propagan a todos
      los agentes.
  - titulo: Desarrollo (Ingenieros construyen el agente)
    html: <strong>Quién:</strong> ingenieros de IA / áreas de negocio.<br><strong>Dónde:</strong> Foundry Playgrounds, extensión
      VS Code, Foundry Projects.<br><em>Development guardrails</em> (XPIA / Spotlighting / AI Red Teaming) se aplican durante
      la construcción.
  - titulo: Deploy (Publicación gobernada)
    html: <strong>Quién:</strong> Ingeniería + IT.<br><strong>Dónde:</strong> Foundry Control Plane → Agent 365 (Microsoft
      Admin Center) onboarding.<br>Identidades de agente registradas en <strong>Entra</strong>; políticas de Guardrail por
      scope aplicadas.
  - titulo: Operación + Gestión
    html: <strong>Quién:</strong> IT Operacional + Seguridad + Ingeniería (debug).<br><strong>Dónde:</strong> Foundry Observability
      + Optimization Dashboard + Agent 365 (Admin Center) + APIM AI Gateway.<br>Monitoreo de uso, performance, riesgo; gestión
      de políticas de acceso, data security y defensa contra amenazas.
  mensagem_chave: <em>“La gobernanza es parte fundamental de la rutina de los profesionales, no un producto externo.”</em>
    — Toda la pila está diseñada para que seguridad, calidad y auditoría estén embebidas en el ciclo, no agregadas después.
  extra_html: '<hr class="section-separator" aria-hidden="true"><section class="page-summary" style="margin-top: 16px;"><span
    class="page-eyebrow"><i class="fa-solid fa-route"></i> Profundización · Cloud Adoption Framework for AI Agents</span><h2
    class="page-summary__title">Ciclo de desarrollo de aplicaciones de IA &amp; agentes</h2><p class="page-summary__lede">El
    <strong>Microsoft Cloud Adoption Framework for AI Agents</strong> formaliza el ciclo en tres bloques que se superponen
    en lugar de seguir en cascada: <strong>Build</strong> (construir con seguridad embebida), <strong>Govern &amp; Secure</strong>
    (gobernar y proteger a escala organizacional) e <strong>Integrate, Manage &amp; Operate</strong> (integrar al negocio
    y operar continuamente). Cada bloque aterriza un capítulo del CAF en los productos de la pila que ya viste en las secciones
    anteriores.</p></section><section class="card card--active" style="margin-top: 16px;"><div class="row" style="gap: 10px;
    margin-bottom: 14px;"><span class="card-icon" style="margin: 0;"><i class="fa-solid fa-hammer"></i></span><div><h3 class="card-title"
    style="margin: 0;">1. Build · Proceso estandarizado para construir agentes</h3><p class="muted" style="margin: 4px 0 0;
    font-size: 13px;">Referencia: <a href="https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/ai-agents/build-secure-process"
    target="_blank" rel="noopener">CAF · Process to build agents</a></p></div></div><div style="font-size: 14px; line-height:
    1.7;"><p>El CAF define <strong>cinco frentes</strong> que todo equipo debe cubrir antes de promover un agente a producción.
    No es un pipeline lineal &mdash; son preocupaciones que corren en paralelo durante el desarrollo, con <em>guardrails</em>
    aplicados en múltiples puntos (input, tool-call, tool-response, output).</p><ol><li><strong>Agent orchestration</strong>
    &mdash; charter del agente, elegir entre <em>managed orchestration</em> (Foundry Agent Service) y <em>code-first</em>
    (Microsoft Agent Framework), workflows determinísticos para lógica crítica y <em>system message</em> versionado como código.</li><li><strong>Model
    selection</strong> &mdash; emparejar capacidad del modelo con la complejidad de la tarea, usar Foundry Model Router y
    leaderboards, validar costo × latencia × calidad antes del deploy.</li><li><strong>Knowledge &amp; tools</strong> &mdash;
    segmentar conocimiento por rol, conectar a repositorios gobernados (Foundry IQ), exponer sistemas vía APIs estrictamente
    scoped, exigir <em>human-in-the-loop</em> para acciones de alto impacto.</li><li><strong>Observability</strong> &mdash;
    tracing OpenTelemetry, evaluators compartidos en un catálogo central, evaluaciones en CI/CD (GitHub Actions / Azure DevOps)
    y AI Red Teaming Agent contra prompt injection.</li><li><strong>Security</strong> &mdash; guardrails en capas (Foundry
    Guardrails + Content Safety + Prompt Shields), blocklists centralizadas, AI Gateway (APIM) delante de cada modelo, Defender
    for Cloud para AI threat protection.</li></ol><figure class="section-figure" style="margin-top: 18px;"><img src="/static/images/observability-security-build-agents.svg"
    alt="Diagrama de observabilidad y seguridad durante el build de agentes — traces, métricas, evaluations y guardrails sobre
    input, tool calls, responses y outputs."><figcaption>Observabilidad y guardrails a lo largo del <em>build</em> &mdash;
    la misma línea cubre traces, métricas y evaluations (arriba) y validación de input, tool-call, tool-response y output
    (abajo). Fuente: Microsoft Learn · CAF for AI Agents.</figcaption></figure></div></section><section class="card card--active"
    style="margin-top: 16px;"><div class="row" style="gap: 10px; margin-bottom: 14px;"><span class="card-icon" style="margin:
    0;"><i class="fa-solid fa-shield-halved"></i></span><div><h3 class="card-title" style="margin: 0;">2. Govern &amp; Secure
    · Pila organizacional de gobernanza</h3><p class="muted" style="margin: 4px 0 0; font-size: 13px;">Referencia: <a href="https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/ai-agents/governance-security-across-organization"
    target="_blank" rel="noopener">CAF · Governance and security for AI agents across the organization</a></p></div></div><div
    style="font-size: 14px; line-height: 1.7;"><p>Todo agente debe ser <strong>observable, gobernado y seguro</strong>. Para
    ello, el CAF prescribe un <strong>control plane único</strong> &mdash; identidad, inventario, política y visibilidad comportamental
    consolidados, independientes de la plataforma. La pila se organiza en cuatro capas verticales que se refuerzan:</p><ul><li><strong>Data
    governance &amp; compliance</strong> &mdash; Microsoft Purview Compliance Manager, Purview APIs, clasificación, DLP, residencia
    de datos y políticas de retención.</li><li><strong>Agent observability</strong> &mdash; Microsoft Agent 365 (Agent Registry
    + Agent Map + hero metrics), Defender for Cloud, Log Analytics, Application Insights y Cost Management.</li><li><strong>Agent
    security</strong> &mdash; Defender for Cloud AI threat protection, Content Safety embebido en el Foundry Control Plane,
    AI Red Teaming Agent, Azure RBAC y Microsoft Sentinel.</li><li><strong>Agent development</strong> &mdash; Microsoft Agent
    Framework, Foundry SDK, MCP (tools) y A2A (agente-a-agente) como estándares obligatorios para toda integración.</li></ul><p>En
    conjunto, estas capas satisfacen los cinco mandatos organizacionales del CAF: <em>saber qué agentes existen · saber quién
    los posee · limitar a qué acceden · observar qué hacen · detener lo que no deberían hacer.</em></p><figure class="section-figure"
    style="margin-top: 18px;"><img src="/static/images/governance-security-stack.svg" alt="Pila de gobernanza y seguridad
    en cuatro capas: Data governance &amp; compliance, Agent observability, Agent security y Agent development, con los productos
    Microsoft en cada capa."><figcaption>Pila de gobernanza y seguridad recomendada por el CAF &mdash; cada capa mapea directamente
    a productos de la pila Microsoft (Purview, Agent 365, Defender, Foundry Control Plane, Agent Framework, MCP/A2A). Fuente:
    Microsoft Learn · CAF for AI Agents.</figcaption></figure></div></section><section class="card card--active" style="margin-top:
    16px;"><div class="row" style="gap: 10px; margin-bottom: 14px;"><span class="card-icon" style="margin: 0;"><i class="fa-solid
    fa-gears"></i></span><div><h3 class="card-title" style="margin: 0;">3. Integrate, Manage &amp; Operate · Llevar a producción
    y mantener</h3><p class="muted" style="margin: 4px 0 0; font-size: 13px;">Referencia: <a href="https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/ai-agents/integrate-manage-operate"
    target="_blank" rel="noopener">CAF · Manage AI agents across your organization</a></p></div></div><div style="font-size:
    14px; line-height: 1.7;"><p>Construir es solo el comienzo. El CAF separa la fase post-deploy en <strong>integración al
    negocio</strong> y <strong>operación continua</strong>:</p><p style="margin-top: 12px;"><strong>Integrate</strong> &mdash;
    embeber al agente donde el trabajo ya ocurre (Teams, portales internos), conducir <em>change management</em> con training
    y expandir por valor demostrado, no por preparación técnica. Estandarizar arquitecturas reutilizables (Bicep / Terraform
    / templates del Agent Builder) para que cada nuevo agente herede controles de seguridad, logging y monitoreo.</p><p style="margin-top:
    12px;"><strong>Manage &amp; Operate</strong> cubre cuatro disciplinas operativas:</p><ul><li><strong>Asset lifecycle</strong>
    &mdash; auditorías trimestrales del estate, retiro de agentes ociosos, administración centralizada vía Foundry Control
    Plane.</li><li><strong>Compliance &amp; security continuas</strong> &mdash; Azure Policy aplicando estándares, alertas
    ruteadas al SOC (Sentinel), red teaming periódico tras cambios relevantes.</li><li><strong>Quota optimization</strong>
    &mdash; revisión mensual de consumo, ajuste dinámico de cuotas según criticidad del workload, elección de modelo optimizada
    por tarea.</li><li><strong>Administration</strong> &mdash; inventario siempre vivo, AI Gateway (APIM) como punto único
    de enforcement de token caps, throttling y logging, con capacidad de pausar agentes/tools durante un incidente.</li></ul><figure
    class="section-figure" style="margin-top: 18px;"><img src="/static/images/observe-governe-segure-agentes.png" alt="Visión
    consolidada del ciclo Observar · Gobernar · Asegurar agentes en operación continua."><figcaption>Visión consolidada &mdash;
    <em>observar</em>, <em>gobernar</em> y <em>asegurar</em> forman el trípode de la operación continua, retroalimentando
    las decisiones de build y gobernanza. Fuente: Microsoft Learn · CAF for AI Agents.</figcaption></figure><p style="margin-top:
    16px;" class="muted"><i class="fa-solid fa-circle-info"></i> Los tres artículos del CAF forman un ciclo: <strong>Build</strong>
    alimenta a <strong>Govern</strong> con evidencia de evaluators y red teaming; <strong>Govern</strong> entrega a <strong>Operate</strong>
    políticas e identidades; y <strong>Operate</strong> devuelve señales de uso, costo y drift que reabren nuevos ciclos de
    Build.</p></div></section>'
  body_localized: true
