texts:
  intro_title: "Microsoft Agent Framework (MAF) + Foundry Workflows"
  intro_lede: >-
    El <strong>Microsoft Agent Framework</strong> es el SDK pro-code que estandariza los
    builders de orquestación — <em>sequential, concurrent, handoff, group chat y
    magentic</em> — y se ejecuta local o en cualquier host. Los <strong>Foundry Workflows</strong>
    expresan la misma topología de forma declarativa (YAML), versionable en Foundry Projects.
    Ambos cubren el <strong>req 1.4.5</strong> (orquestación multi-agente) del Framework IA Contoso.
  demo_eyebrow: Demo interactiva
  demo_title: "Elige el patrón y mira la topología en tiempo real"
  demo_lede: >-
    Selecciona uno de los 5 patrones del MAF — el diagrama a la izquierda se redibuja y el trace SSE
    abajo muestra el orden real de los hops. Misma pregunta, comportamientos distintos.
  source_mock_title: "Simulación local"
  source_real_title: "Respuesta del MAFW real"
