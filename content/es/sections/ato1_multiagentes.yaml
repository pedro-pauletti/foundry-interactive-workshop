  procode_eyebrow: "Pro-code · MAF (Python)"
  procode_title: "Builders del Microsoft Agent Framework"
  procode_lede: >-
    Los 5 patrones mostrados arriba se mapean 1-a-1 a los builders del SDK. Misma topología,
    código consistente — local, container o hosted en Foundry.
  lowcode_eyebrow: "Low-code · Foundry Workflows (YAML)"
  lowcode_title: "Mismo patrón, declarativo y versionable"
  lowcode_lede: >-
    Foundry Workflows expresa la topología en YAML — versionable en el Foundry Project,
    con branching, fan-out, retry y timeout de fábrica.
