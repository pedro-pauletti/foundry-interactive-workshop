section:
  title: Mapeo de Requisitos Contoso × Stack Microsoft
  description: >-
    Los requisitos del Framework IA Contoso y cómo cada producto o capacidad
    de la stack Microsoft (Foundry, Agent 365, APIM, Entra, Purview) los aborda.
