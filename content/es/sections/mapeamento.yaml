  how_to_read_title: Cada fila = un requisito del Framework IA Contoso
  how_to_read_lede: >-
    Esta es la <strong>visión consolidada</strong> de la Sección 2 del documento de mapeo. Use la
    búsqueda libre y los filtros por <strong>pilar</strong> y por <strong>estado de cumplimiento</strong>
    para llegar rápidamente al requisito de interés. Las demás secciones de la agenda demuestran en
    detalle las capacidades aquí referenciadas.
