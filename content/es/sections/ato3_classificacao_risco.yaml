texts:
  intro_title: ¿Por qué clasificar riesgo antes del deploy?
  intro_lede: >-
    La clasificación de riesgo transforma un requisito subjetivo ("¿es seguro?") en
    <strong>criterios medibles</strong> que se vuelven <em>policy-as-code</em>.
    Sin esto, el <strong>PL 2338/2023</strong> (Marco Legal de IA de Brasil, en trámite) y
    la <strong>LGPD art. 20</strong> (revisión de decisiones automatizadas) se vuelven
    procesos manuales lentos. Con Custom Azure Policy en Foundry Control Plane se
    convierte en un <em>guardrail automatizado</em>.
  marco_eyebrow: "Marco regulatorio · PL 2338/2023"
  marco_title: 5 pilares aplicables a sistemas Contoso
  dims_eyebrow: "Dimensiones de riesgo · criterios parametrizables"
  dims_title: Las 4 preguntas que toda Custom Policy debe responder
  dims_options_label: "opciones"
  demo_eyebrow: "Demo interactiva · Custom Azure Policy"
  demo_title: Simula la evaluación de riesgo en runtime
  demo_badge_title: Simulación local — lógica equivalente a la Custom Policy real
  demo_lede: >-
    Configura un caso de uso. El endpoint ejecuta el mismo algoritmo que la Custom Policy
    correría en Foundry Control Plane: cálculo de score → clasificación alto/medio/bajo
    → acción <em>deny / audit / allow</em>.
