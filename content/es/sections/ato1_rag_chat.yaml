  eval_eyebrow: Evaluación automática
  eval_title: Ejecutar evaluation con métricas de RAG
  eval_lede: >-
    Ejecuta un <strong>conjunto canónico de preguntas</strong> contra la estrategia seleccionada
    y calcula las métricas oficiales de
    <a href="https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/rag-evaluators"
       target="_blank" rel="noopener">Foundry RAG evaluators</a>:
    <code>groundedness</code>, <code>relevance</code>, <code>retrieval</code> y
    <code>response_completeness</code>. Umbral de pass: <strong>0.60</strong>.
