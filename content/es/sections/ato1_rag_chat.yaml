texts:
  intro_title: RAG corporativo con Foundry IQ
  intro_lede: >-
    <strong>Foundry IQ</strong> es el motor de retrieval gestionado de Foundry: indexación,
    embeddings, hybrid search y re-ranking como servicio. La demo siguiente muestra el
    <strong>impacto de la estrategia de retrieval</strong> sobre la misma base de conocimiento Contoso.
  demo_eyebrow: Demo interactiva
  demo_title: Curador Contoso — alterna entre estrategias de retrieval
  demo_lede: >-
    Selecciona una estrategia, haz una pregunta y observa
    <strong>cuántos documentos se recuperaron, con qué score y qué latencia</strong>.
    La respuesta proviene de Foundry cuando está configurado; en caso contrario, de una simulación local.
  modes_aria: Estrategia de retrieval
  mode_simple_name: Simple Search
  mode_simple_desc: "keyword (BM25) puro · top-2 · ~150ms"
  mode_semantic_name: Semantic + Rerank
  mode_semantic_desc: "vector + reranker · top-3 · ~350ms"
  mode_agentic_name: Agentic Retrieval
  mode_agentic_desc: "query planning + fusion · top-3 · ~650ms"
